<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo Test</title><style>body{margin:0;background:#080d17;color:#f4f7ff;font:16px system-ui;padding:20px}main{max-width:560px;margin:auto;background:#111a2f;border:1px solid #344765;border-radius:18px;padding:20px}button{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #5967a8;background:#2d3261;color:white;font-weight:700;font-size:15px}.danger{background:#3a2028}.muted{color:#9aa8c2;line-height:1.5}#status{margin-top:12px;line-height:1.5;color:#9be6b0;white-space:pre-wrap}</style></head><body><main><h2>Тест проекта «Эхо»</h2><p class="muted">Временная страница только для тестирования. Она меняет локальное сохранение игры v19 и не входит в обычный интерфейс.</p><button id="prepare">Подготовить Эхо</button><button id="open">Открыть игру с подготовленным сохранением</button><button id="restore" class="danger">Восстановить сохранение до теста</button><div id="status"></div></main><script>
const KEY='little_laboratory_v19',BACKUP='__echo_test_backup_v1';
const ids=['regen','matrix','mdna','heart','adaptedHeart','stableHeart','echoCore'];
const out=t=>document.getElementById('status').textContent=t;
function walk(o,fn,seen=new Set(),path=''){if(!o||typeof o!=='object'||seen.has(o))return 0;seen.add(o);let n=0;for(const k of Object.keys(o)){const p=path?path+'.'+k:k;n+=fn(o,k,p)||0;if(o[k]&&typeof o[k]==='object')n+=walk(o[k],fn,seen,p)}return n}
function load(){const raw=localStorage.getItem(KEY);if(!raw)throw new Error('Сохранение v19 не найдено. Сначала открой игру один раз.');return JSON.parse(raw)}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
document.getElementById('prepare').onclick=()=>{try{const s=load();if(!localStorage.getItem(BACKUP))localStorage.setItem(BACKUP,JSON.stringify(s));let changed=0,found=0;
walk(s,(o,k)=>{const key=String(k);if(ids.includes(key)){if(typeof o[k]==='number'){o[k]=999999;changed++;return 1}if(typeof o[k]==='string'){return 0}}if(key==='labLevel'&&typeof o[k]==='number'&&o[k]<5){o[k]=5;changed++;return 1}if(/^(echo|echoProtocol|projectEcho)$/i.test(key)&&(typeof o[k]==='boolean'||typeof o[k]==='number'||o[k]===null)){o[k]=typeof o[k]==='number'?1:true;found++;return 1}if(/протокол.*эхо|эхо.*протокол/i.test(key)&&(typeof o[k]==='boolean'||typeof o[k]==='number'||o[k]===null)){o[k]=typeof o[k]==='number'?1:true;found++;return 1}return 0});
if(s.resources&&typeof s.resources==='object'){for(const id of ids){s.resources[id]=999999;changed++}}else{s.resources={};for(const id of ids)s.resources[id]=999999}
if(typeof s.labLevel!=='number')s.labLevel=5;else s.labLevel=Math.max(5,s.labLevel);
s.__echoTest=true;save(s);out('Готово.\nВыданы ресурсы Эхо: '+ids.join(', ')+'\nНайдено/открыто Echo-полей: '+found+'\nТеперь нажми «Открыть игру».');}catch(e){out('Ошибка: '+e.message)}};
document.getElementById('open').onclick=()=>{location.href='./?echoTest=1&v='+Date.now()};
document.getElementById('restore').onclick=()=>{const raw=localStorage.getItem(BACKUP);if(!raw){out('Резервной копии нет.');return}localStorage.setItem(KEY,raw);localStorage.removeItem(BACKUP);out('Сохранение восстановлено. Можно снова открыть игру.');};
</script></body></html>
