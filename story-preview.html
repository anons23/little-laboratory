<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Маленькая Лаборатория — сюжетный пролог</title><style>html,body{margin:0;height:100%;background:#080c16;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.cover{position:fixed;inset:0;z-index:5;background:#080c16ee;display:grid;place-items:center;padding:18px}.card{width:min(540px,100%);max-height:82vh;overflow:auto;background:#111a2f;border:1px solid #394767;border-radius:22px;padding:22px;box-sizing:border-box;box-shadow:0 25px 80px #000c}.k{font-size:12px;letter-spacing:.12em;color:#7c8cff;font-weight:800}.card h1{font-size:25px;margin:8px 0}.card p{color:#b8c2d8;line-height:1.6}.q{padding:13px 14px;border-left:3px solid #7c5cff;background:#151e35;border-radius:0 12px 12px 0;font-style:italic;color:#d7def1}.g{display:grid;gap:9px;margin:16px 0}.g div{padding:11px 12px;border-radius:13px;background:#151e35;border:1px solid #293653}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:#6855e8;color:white;font-weight:800;font-size:16px}.skip{background:#202b45;margin-top:8px}.note{position:fixed;inset:0;z-index:6;background:#080c16dd;display:none;place-items:center;padding:18px}.note .card{display:block}.art{height:160px;border-radius:18px;margin:12px 0;background:radial-gradient(circle at 50% 35%,#596783 0 4%,transparent 5%),radial-gradient(ellipse at 50% 50%,#26324e 0 18%,transparent 19%),linear-gradient(#0a0f1d,#141c30 55%,#080c16);position:relative}.art:before{content:"";position:absolute;left:50%;top:25px;transform:translateX(-50%);width:70px;height:115px;border-radius:45%;background:linear-gradient(#596783,#182137);box-shadow:0 0 35px #65749c44}.art:after{content:"⛓  ⛓  ⛓";position:absolute;bottom:15px;left:0;right:0;text-align:center;color:#8c98b4;letter-spacing:10px}</style></head><body><iframe src="./index.html" id="game"></iframe><div class="cover" id="intro"><div class="card" id="card"></div></div><div class="note" id="note"><div class="card"><div class="k" id="nk"></div><h1 id="nt"></h1><div id="nb"></div><button class="btn" id="nc">Продолжить</button></div></div><script>(()=>{const intro=document.getElementById('intro'),card=document.getElementById('card');let step=0;const steps=[['СИГНАЛ ИЗ ЭХА · ПРОЛОГ','Лаборатория твоего наставника','Ты — ученик биолога, который несколько лет назад бесследно исчез. Перед исчезновением он передал тебе эту лабораторию, но почти ничего не объяснил.<p>В его архивах постоянно встречалось одно слово: <b>«Эхо»</b>.</p><div class="q">«Если однажды ты решишь продолжить мою работу — сначала пойми, что именно я пытался создать.»</div>'],['ЧТО ПРОИЗОШЛО','Он искал следующую ступень человека','Профессор пытался создать организм, который сможет восстанавливать себя, менять ткани и выдерживать то, что обычный человек пережить не способен.<p>Последние страницы журнала обрываются на словах: <b>«Эхо готово к финальной перестройке»</b>.</p><div class="g"><div>🧬 <b>Твоя цель</b><br>Восстановить лабораторию и понять судьбу проекта.</div><div>📓 <b>Новые открытия</b><br>Редкие материалы будут открывать записи профессора.</div></div>'],['ПЕРВЫЕ ШАГИ','Лаборатория работает по простой схеме','<div class="g"><div>🧫 <b>Производи</b> — инкубатор даёт образцы.</div><div>🧪 <b>Сочетай</b> — проверяй неизвестные реакции.</div><div>💰 <b>Развивайся</b> — продавай, выполняй заказы и покупай аппараты.</div><div>🔬 <b>Исследуй</b> — наука открывает технологии и путь к Эхо.</div></div>'],['ПЕРВЫЙ ЭКСПЕРИМЕНТ','Начни с двух компонентов','На складе уже есть 🧫 клеточная культура и 🩸 кровь.<p>Открой <b>Лаборатория → Стол</b>, выбери оба материала и проведи эксперимент.</p><div class="g"><div>⚡ Эксперимент стоит 10 энергии.</div><div>📖 Удачные открытия попадут в Архив.</div><div>📓 Редкие открытия могут открыть запись профессора.</div></div>']];function render(){const x=steps[step];card.innerHTML='<div class="k">'+x[0]+'</div><h1>'+x[1]+'</h1><p>'+x[2]+'</p><button class="btn" id="next">'+(step<3?'Продолжить':'Начать игру')+'</button><button class="btn skip" id="skip">Пропустить пролог</button>';document.getElementById('next').onclick=()=>{if(step<3){step++;render()}else{intro.style.display='none';startNotes()}};document.getElementById('skip').onclick=()=>{intro.style.display='none';startNotes()}}function startNotes(){setInterval(()=>{try{const raw=localStorage.getItem('little_laboratory_v18');if(!raw)return;const s=JSON.parse(raw),seen=JSON.parse(localStorage.getItem('little_laboratory_story_preview')||'{}');const notes={serum:['Запись №017','Первый стабильный результат.','<p>«Клетки приняли изменённую последовательность без отторжения. Ассистент снова просит прекратить опыты.»</p>'],mdna:['Запись №043','Теперь профессор смешивает несовместимое.','<p>«Человеческая ткань и свойства хищника дали устойчивый результат. Ассистент назвал это созданием чудовища. Я назвал это адаптацией.»</p>'],heart:['Запись №061','Первый искусственный орган.','<p>«Сердце работает. Подопытный выжил. Он спросил, почему я называю его подопытным.»</p>'],stableHeart:['Запись №074','Эхо почти готово.','<p>«Стабильность достигнута. Теперь организм сможет пережить финальную перестройку.»</p>']};for(const k in notes)if(s.discovered?.includes(k)&&!seen[k]){seen[k]=1;localStorage.setItem('little_laboratory_story_preview',JSON.stringify(seen));document.getElementById('nk').textContent=notes[k][0];document.getElementById('nt').textContent=notes[k][1];document.getElementById('nb').innerHTML='<div class="art"></div>'+notes[k][2];document.getElementById('note').style.display='grid';break}}catch(e){}},1000)}document.getElementById('nc').onclick=()=>document.getElementById('note').style.display='none';render()})();</script></body></html>
