name: v1.7 full hardening
on:
  push:
    branches: [v1.7]
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.7
          fetch-depth: 1
      - name: Patch gameplay, UX and performance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); h=p.read_text(encoding='utf-8')
          css='''\n          /* v1.7 HARDENING: compact mobile UX + reduced visual work */\n          @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}\n          @media(max-width:560px){.screen{padding:10px}.hero-card{padding:20px 14px 18px}.hero-card h1{font-size:24px}.lab-title h2,.section-head h2{font-size:19px}.panel{padding:11px}.production-core{gap:10px}.machine{width:58px;height:58px;font-size:30px}.reaction-slot-btn{min-width:82px;min-height:64px}.collection-grid,.warehouse-grid{grid-template-columns:1fr 1fr}.component-picker-grid{grid-template-columns:1fr}.wheel-wrap{transform:scale(.92);margin-top:4px;margin-bottom:0}}\n          .echo-progress{margin:12px 0;padding:14px;border:1px solid rgba(70,190,210,.28);border-radius:18px;background:linear-gradient(145deg,rgba(10,24,36,.82),rgba(6,16,26,.88));box-shadow:0 8px 24px rgba(0,0,0,.22)}\n          .echo-progress h3{margin:0 0 9px;font-size:15px}.echo-progress-list{display:grid;gap:6px}.echo-progress-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:11px;background:rgba(20,35,50,.55);font-size:12px}.echo-progress-item.done{border:1px solid rgba(100,210,170,.25)}.echo-progress-item.missing{border:1px solid rgba(180,120,130,.18);opacity:.78}.echo-progress-state{font-weight:800;font-size:11px}.echo-progress-item.done .echo-progress-state{color:#8ee0ae}.echo-progress-item.missing .echo-progress-state{color:#aeb8d0}\n          '''
          if 'v1.7 HARDENING: compact mobile UX' not in h:
              pos=h.rfind('</style>'); assert pos>=0; h=h[:pos]+css+h[pos:]
          if 'function renderNow(){' not in h:
              assert 'function render(){' in h
              h=h.replace('function render(){','function renderNow(){',1)
              wrapper='''\n          function render(){\n            if(window.__llRenderQueued){window.__llRenderAgain=true;return}\n            window.__llRenderQueued=true;\n            const flush=()=>{window.__llRenderQueued=false;renderNow();renderEchoProgress();if(window.__llRenderAgain){window.__llRenderAgain=false;render()}};\n            if(typeof requestAnimationFrame==='function')requestAnimationFrame(flush);else setTimeout(flush,50);\n          }\n          '''
              idx=h.find('function renderNow(){'); h=h[:idx]+wrapper+h[idx:]
          if 'function renderEchoProgress(){' not in h:
              echo='''\n          function renderEchoProgress(){\n            const host=document.querySelector('#creature'); if(!host||!s)return;\n            let box=host.querySelector('.echo-progress');\n            if(!box){box=document.createElement('section');box.className='echo-progress';host.insertBefore(box,host.firstElementChild||null)}\n            const bag=s.res||s.resources||s; const has=k=>Number(bag?.[k]||0)>0;\n            const items=[['stableHeart','Стабильное сердце'],['matrix','Матрица'],['mdna','М-ДНК'],['regen','Регенерация'],['bioenergy','Биоэнергия']];\n            box.innerHTML='<h3>Прогресс проекта «Эхо»</h3><div class="echo-progress-list">'+items.map(([k,label])=>`<div class="echo-progress-item ${has(k)?'done':'missing'}"><span>${has(k)?'✓':'○'} ${label}</span><span class="echo-progress-state">${has(k)?'ГОТОВО':'НУЖНО'}</span></div>`).join('')+'</div>';\n          }\n          '''
              idx=h.find('function renderNow(){'); h=h[:idx]+echo+h[idx:]
          if 'function prestige(){' in h and 'function ensureStateShape' in h:
              a=h.find('function prestige(){'); b=a+400
              if 'ensureStateShape();' not in h[a:b]: h=h[:a+len('function prestige(){')]+ 'ensureStateShape();' + h[a+len('function prestige(){'):]
          if 'v1.7 HARDENING lifecycle' not in h:
              lifecycle='''\n          /* v1.7 HARDENING lifecycle */\n          let __llLastVisible=nowMs();\n          document.addEventListener('visibilitychange',()=>{\n            if(document.visibilityState==='hidden'){__llLastVisible=nowMs();return}\n            const gap=Math.max(0,(nowMs()-__llLastVisible)/1000);\n            if(gap>1){lastTick=nowMs();if(typeof settleWheelPending==='function')settleWheelPending();render()}\n          },{passive:true});\n          '''
              end=h.rfind('</script>'); assert end>=0; h=h[:end]+lifecycle+h[end:]
          p.write_text(h,encoding='utf-8')
          PY
      - name: Add real economy scenario tests
        run: |
          cat > tests/test_gameplay_economy.py <<'PY'
          from pathlib import Path
          HTML=Path('index.html').read_text(encoding='utf-8')
          def test_offline_scenarios_are_capped():
              assert 'Math.min(10800,Math.max(0,(nowMs()-num(s.lastOffline))/1000))' in HTML
              assert 'Math.max(0,dt)' in HTML
          def test_daily_limits_use_server_time(): assert 'function today(){const d=new Date(nowMs())' in HTML
          def test_render_is_frame_coalesced():
              assert 'function renderNow(){' in HTML and 'window.__llRenderQueued' in HTML and 'requestAnimationFrame(flush)' in HTML
          def test_echo_checklist_exists():
              assert 'function renderEchoProgress(){' in HTML
              for key in ('stableHeart','matrix','mdna','regen','bioenergy'): assert f"['{key}'" in HTML
          def test_reward_reset_persistence_markers_exist():
              assert 'adCounts:clone(s.adCounts||base.adCounts)' in HTML and 'fortuneFree:s.fortuneFree' in HTML and 'fortuneAds:s.fortuneAds' in HTML
          def test_prestige_and_reset_preserve_meta():
              assert 'meta.resets=(meta.resets||0)+1' in HTML and 'meta.bestLevel=Math.max(meta.bestLevel||1,s.labLevel||1)' in HTML and 'await save(false,true)' in HTML
          def test_no_unsafe_dynamic_code(): assert 'eval(' not in HTML and 'new Function(' not in HTML
          def test_lifecycle_reentry_path_exists():
              assert "document.addEventListener('visibilitychange'" in HTML and 'settleWheelPending()' in HTML and 'lastTick=nowMs()' in HTML
          if __name__=='__main__':
              tests=[v for n,v in globals().items() if n.startswith('test_')]
              for t in tests:t()
              print(f'Gameplay economy tests OK: {len(tests)}')
          PY
          python3 tests/test_gameplay_economy.py
          python3 tests/test_game_integrity.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S); js=scripts[-1] if scripts else ''
          if not js.strip(): raise SystemExit('inline game script missing')
          Path('/tmp/game.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/test_gameplay_economy.py
          git commit -m 'feat: harden gameplay economy echo ux and mobile performance'
          git rm .github/workflows/v17-full-hardening.yml
          git commit -m 'chore: remove temporary hardening workflow'
          git push origin HEAD:v1.7
