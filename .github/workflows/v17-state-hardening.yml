name: v1.7 state hardening
on:
  push:
    branches: [v1.7]
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[state-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden save state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='function ensureStateShape(){'
          if marker in s:
              raise SystemExit('state hardening already present')
          needle='function render(){'
          if needle not in s:
              raise SystemExit('render function not found')
          fn="""function ensureStateShape(){\nconst obj=(v)=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};\ns.tech=obj(s.tech);for(const t of techs)if(!Number.isFinite(Number(s.tech[t[0]])))s.tech[t[0]]=0;\ns.machines=obj(s.machines);for(const m of machines)if(!Number.isFinite(Number(s.machines[m[0]]))||Number(s.machines[m[0]])<0)s.machines[m[0]]=0;\ns.tasks=obj(s.tasks);s.tasks.claimed=obj(s.tasks.claimed);if(!Array.isArray(s.tasks.active))s.tasks.active=clone(base.tasks.active);\ns.adCounts=obj(s.adCounts);\ns.orders=obj(s.orders);if(!Array.isArray(s.orders.active))s.orders.active=[];s.orders.claimed=obj(s.orders.claimed);\ns.storySeen=obj(s.storySeen);s.installed=obj(s.installed);s.exp=obj(s.exp);\ns.meta=obj(s.meta);s.event=obj(s.event);\nfor(const k of keys){const v=Number(s[k]);if(!Number.isFinite(v)||v<0)s[k]=0;}\nfor(const k of ['money','research','energy','capacity','labLevel','prestige','fortuneFree','fortuneAds']){const v=Number(s[k]);if(!Number.isFinite(v)||v<0)s[k]=Number(base[k])||0;}\n}\n"""
          s=s.replace(needle,fn+needle,1)
          s=s.replace(needle,needle+'ensureStateShape();',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Run integrity tests
        run: python3 tests/test_game_integrity.py
      - name: Check inline JavaScript
        run: python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S))
          Path('/tmp/game.js').write_text(js,encoding='utf-8')
          subprocess.run(['node','--check','/tmp/game.js'],check=True)
          print('Inline JS syntax OK')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Harden runtime save state [state-hardened]'
          git push
          git rm .github/workflows/v17-state-hardening.yml
          git commit -m 'Remove state hardening workflow [state-hardened]'
          git push
