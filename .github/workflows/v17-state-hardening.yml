name: v1.7 state hardening v2
on:
  push:
    branches: [v1.7]
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch state normalization
        run: |
          echo '' | base64 -d > /tmp/state.js
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); fn=Path('/tmp/state.js').read_text(); assert 'function ensureStateShape(){' not in s; assert 'function render(){' in s; s=s.replace('function render(){',fn+'function render(){',1); s=s.replace('function render(){', 'function render(){ensureStateShape();',1); p.write_text(s,encoding='utf-8')"
      - name: Verify
        run: |
          python3 tests/test_game_integrity.py
          python3 -c "from pathlib import Path; import re; Path('/tmp/game.js').write_text('\\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',Path('index.html').read_text(encoding='utf-8'),re.S)),encoding='utf-8')"
          node --check /tmp/game.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Harden runtime save state [state-hardened]'
          git push
          git rm .github/workflows/v17-state-hardening.yml
          git commit -m 'Remove state hardening workflow [state-hardened]'
          git push
