name: v1.7 prestige state fix
on:
  push:
    branches: [v1.7]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[prestige-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prestige state handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""function prestige(){if(s.labLevel<5)return toast('Для престижа нужен 5 уровень');if(!confirm('Престиж сбросит материалы, деньги, аппараты и технологии. Ранг останется и даст +5% к производству. Продолжить?'))return;const p=s.prestige+1;const daily={fortuneDay:s.fortuneDay,fortuneFree:s.fortuneFree,fortuneAds:s.fortuneAds,adDay:s.adDay,adCounts:clone(s.adCounts||base.adCounts),adWarehouseUntil:s.adWarehouseUntil,adDiscountUntil:s.adDiscountUntil,adProductionUntil:s.adProductionUntil,introSeen:s.introSeen,storySeen:clone(s.storySeen||{})};s=clone(base);s.prestige=p;Object.assign(s,daily);s.lastSave=nowMs();s.lastOffline=s.lastSave;localStorage.setItem(KEY,JSON.stringify(s));selected=[];render()}"""
          new="""async function prestige(){if(s.labLevel<5)return toast('Для престижа нужен 5 уровень');if(!confirm('Престиж сбросит материалы, деньги, аппараты и технологии. Ранг останется и даст +5% к производству. Продолжить?'))return;const p=(s.prestige|0)+1;const meta=clone(s.meta||base.meta);meta.resets=(meta.resets||0)+1;meta.bestLevel=Math.max(meta.bestLevel||1,s.labLevel||1);const daily={fortuneDay:s.fortuneDay,fortuneFree:s.fortuneFree,fortuneAds:s.fortuneAds,adDay:s.adDay,adCounts:clone(s.adCounts||base.adCounts),adWarehouseUntil:s.adWarehouseUntil,adDiscountUntil:s.adDiscountUntil,adProductionUntil:s.adProductionUntil,introSeen:s.introSeen,storySeen:clone(s.storySeen||{}),meta:meta};s=clone(base);s.prestige=p;Object.assign(s,daily);s.lastSave=nowMs();s.lastOffline=s.lastSave;localStorage.setItem(KEY,JSON.stringify(s));selected=[];await save(false,true);render();toast('⭐ Престиж '+p+' — производство +'+(p*5)+'%')}"""
          if old not in s:
              raise SystemExit('prestige target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 tests/test_game_integrity.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>(.*?)</script>',s,re.S).group(1)
          Path('/tmp/game.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit fix and remove workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Fix prestige state preservation [prestige-fixed]'
          git push
          git rm .github/workflows/v17-prestige-fix.yml
          git commit -m 'Remove temporary prestige fix workflow [prestige-fixed]'
          git push
