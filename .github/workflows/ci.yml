# final-build-verification
# v1.7 hardening verification
name: Little Laboratory CI

on:
  push:
    branches: [main, v1.7]
  pull_request:
    branches: [main, v1.7]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required files
        run: |
          set -euo pipefail
          test -f index.html
          test -f style.css
          test -f game.json
          test -f README.md
          test -f .github/workflows/ci.yml
          test -d assets

      - name: Validate archive file names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('.').rglob('*'):
              if '.git' in p.parts:
                  continue
              if any(ord(ch)>127 or ch.isspace() for ch in p.name):
                  bad.append(str(p))
          if bad:
              raise SystemExit('Invalid archive path names (Cyrillic/whitespace): '+repr(bad))
          print('Archive file names OK')
          PY

      - name: Validate game manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('game.json').read_text(encoding='utf-8'))
          required={'name','version','entry','orientation'}
          missing=required-data.keys()
          if missing: raise SystemExit(f'Missing game.json fields: {sorted(missing)}')
          if data['entry']!='index.html': raise SystemExit('game.json entry must be index.html')
          print(f"Manifest OK: {data['name']} {data['version']}")
          PY

      - name: Validate HTML and Yandex SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          checks=[
            ('doctype','<!doctype html>' in html.lower()),
            ('viewport','name="viewport"' in html.lower()),
            ('style.css',bool(re.search(r'href=["\']style\.css(?:\?[^"\']*)?["\']',html,re.I))),
            ('Yandex Games SDK','https://sdk.games.s3.yandex.net/sdk.js' in html),
            ('YaGames.init','YaGames.init()' in html),
            ('Yandex I18N','environment?.i18n?.lang' in html),
            ('no old Cyrillic GIF refs','assets/Опыты.gif' not in html and 'assets/Эхо.gif' not in html),
            ('no old fortune-wheel label','Колесо фортуны' not in html),
          ]
          failed=[name for name,ok in checks if not ok]
          if failed: raise SystemExit('HTML checks failed: '+', '.join(failed))
          external=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          allowed='https://sdk.games.s3.yandex.net/sdk.js'
          unexpected=[u for u in external if u!=allowed]
          if unexpected: raise SystemExit('Unexpected external JavaScript source: '+', '.join(unexpected))
          print('HTML, Yandex SDK and I18N checks OK')
          PY

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.I|re.S)
          inline=[x for x in scripts if x.strip()]
          if not inline: raise SystemExit('No inline JavaScript found')
          Path('/tmp/game-inline.js').write_text('\n\n'.join(inline),encoding='utf-8')
          print(f'Extracted {len(inline)} inline script block(s)')
          PY
          node --check /tmp/game-inline.js

      - name: Run game integrity tests
        run: python3 tests/test_game_integrity.py

      - name: Run gameplay economy tests
        run: python3 tests/test_gameplay_economy.py

      - name: Check runtime economy invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          required=[
            'function nowMs(){return typeof ysdk?.serverTime===\'function\'?ysdk.serverTime():Date.now()}',
            'function today(){const d=new Date(nowMs())',
            'Math.min(10800,Math.max(0,(nowMs()-num(s.lastOffline))/1000))',
            'window.__productionCacheKey===sig',
            'pr.dataset.rateKey!==key',
            'list.dataset.rateKey!==key',
            'await player.setData(s,false)',
            'function renderNow(){',
            'window.__llRenderQueued',
            'environment?.i18n?.lang',
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Runtime invariants missing: '+repr(missing))
          if 'renderEchoProgress()' in html: raise SystemExit('Removed Echo progress renderer is still referenced')
          print('Runtime economy invariants OK')
          PY

      - name: Check moderation layout guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          required=[
            'html,body{width:100%;height:100%;min-height:100%;overflow:hidden!important',
            '#game{height:100vh;min-height:100vh;overflow:hidden!important}',
            'main{height:calc(100vh - 110px);min-height:0;overflow:hidden!important}',
            '.screen{height:100%;min-height:0;overflow-x:hidden;overflow-y:auto',
          ]
          missing=[x for x in required if x not in css]
          if missing: raise SystemExit('Moderation layout guards missing: '+repr(missing))
          if 'overscroll-behavior:none' not in css: raise SystemExit('Swipe-to-refresh guard missing')
          print('Moderation layout guards OK')
          PY

      - name: Check for accidental local-file URLs
        run: |
          if grep -RniE 'file://|javascript:' index.html style.css game.json README.md tests; then
            echo 'Unsafe/local URL pattern found'
            exit 1
          fi

      - name: Build distributable archive
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/little-laboratory/assets
          cp index.html style.css game.json README.md dist/little-laboratory/
          cp assets/* dist/little-laboratory/assets
          (cd dist && zip -qr little-laboratory-yandex-games.zip little-laboratory)
          test -s dist/little-laboratory-yandex-games.zip
          python3 - <<'PY'
          from pathlib import Path
          import os
          total=sum(p.stat().st_size for p in Path('dist/little-laboratory').rglob('*') if p.is_file())
          if total>100*1024*1024: raise SystemExit(f'Archive exceeds 100 MiB: {total}')
          print(f'Archive uncompressed size: {total} bytes')
          PY

      - name: Upload game archive
        uses: actions/upload-artifact@v4
        with:
          name: little-laboratory-yandex-games
          path: dist/little-laboratory-yandex-games.zip
          if-no-files-found: error
