name: Update laboratory features

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply feature update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def rep(a,b):
              global s
              if a not in s:
                  raise SystemExit('missing marker: '+a[:120])
              s=s.replace(a,b,1)

          rep("<button id=\"prestigeBtn\" class=\"small-btn\">⭐ Престиж</button>","<button id=\"prestigeBtn\" class=\"small-btn\">⭐ Престиж</button><button id=\"resetLabBtn\" class=\"small-btn danger-btn\">🗑️ Новая лаборатория</button>")
          rep('<div id="techTree" class="tech-grid"></div><div id="tasksPanel"></div>','<div id="techTree" class="tech-grid"></div><div id="tasksPanel"></div><div id="ordersPanel"></div><div id="eventPanel"></div>')
          rep("const KEY='little_laboratory_v17',OLD_KEYS=['little_laboratory_v16','little_laboratory_v15','little_laboratory_v14','little_laboratory_v13','little_laboratory_v12']","const KEY='little_laboratory_v18',OLD_KEYS=['little_laboratory_v17','little_laboratory_v16','little_laboratory_v15','little_laboratory_v14','little_laboratory_v13','little_laboratory_v12']")
          rep("const base={version:16,money:120", "const base={version:18,money:120")
          rep("echoDone:false,machines:{", "echoDone:false,meta:{bestLevel:1,totalExperiments:0,totalSales:0,totalOrders:0,resets:0},orders:{day:'',active:[],claimed:{}},event:{id:'',expires:0},machines:{")
          rep("function normalize(x){const z=clone(base);if(!x||typeof x!=='object')return z;", "function normalize(x){const z=clone(base);if(!x||typeof x!=='object')return z;if(x.meta&&typeof x.meta==='object')for(const k of Object.keys(z.meta))z.meta[k]=Math.max(0,Math.floor(num(x.meta[k])));if(x.orders&&typeof x.orders==='object'){z.orders.day=x.orders.day||'';z.orders.active=Array.isArray(x.orders.active)?x.orders.active.slice(0,3):[];z.orders.claimed=x.orders.claimed&&typeof x.orders.claimed==='object'?x.orders.claimed:{}}if(x.event&&typeof x.event==='object'){z.event.id=typeof x.event.id==='string'?x.event.id:'';z.event.expires=Math.max(0,num(x.event.expires))} ")
          rep("function updateLevel(){s.labLevel=Math.max(s.labLevel,levelFromResearch(s.research))}", "function updateLevel(){s.labLevel=Math.max(s.labLevel,levelFromResearch(s.research));if(s.meta)s.meta.bestLevel=Math.max(s.meta.bestLevel||1,s.labLevel)}")
          rep("s.tasks.experiment++;if(ok&&out)", "s.tasks.experiment++;if(s.meta)s.meta.totalExperiments++;if(ok&&out)")
          rep("s[k]-=qty;s.money+=sellPrices[k]*qty;s.tasks.sell+=qty;", "s[k]-=qty;s.money+=sellPrices[k]*qty;s.tasks.sell+=qty;if(s.meta)s.meta.totalSales+=qty;")
          rep("function renderTasks(){", "function orderPool(){const c=[];const add=(id,level,req,money,research,title)=>{if(s.labLevel>=level)c.push({id,level,req,money,research,title})};add('blood10',1,[['blood',10]],170,8,'🩸 Срочный заказ крови');add('sample25',1,[['sample',25]],20,18,'🧫 Поставка клеточных культур');add('reagent8',2,[['reagent',8]],150,25,'🧪 Заказ реагентов');add('blood20',3,[['blood',20]],360,35,'🏥 Заказ медицинского центра');add('dna6',4,[['dna',6]],300,60,'🧬 Заказ генетической лаборатории');add('serum4',5,[['serum',4]],900,80,'💉 Срочная поставка сыворотки');add('gel3',6,[['gel',3]],800,110,'🧠 Заказ нейрогеля');add('matrix2',7,[['matrix',2]],1400,160,'🧠 Закрытый заказ нейроматриц');add('rare_mix',8,[['mdna',1],['regen',2]],1700,260,'⚡ Специальный исследовательский заказ');return c}function makeOrders(){const pool=orderPool().sort(()=>Math.random()-.5);s.orders.active=pool.slice(0,3);s.orders.claimed={};s.orders.day=today()}function ensureOrders(){if(s.orders.day!==today()||!Array.isArray(s.orders.active)||s.orders.active.length<3)makeOrders()}function fulfillOrder(index){ensureOrders();const o=s.orders.active[index];if(!o||s.orders.claimed[o.id])return;for(const [k,q] of o.req)if(num(s[k])<q)return toast('Не хватает: '+label(k)+' × '+q);for(const [k,q] of o.req)s[k]-=q;s.money+=o.money;s.research+=o.research;s.orders.claimed[o.id]=1;if(s.meta)s.meta.totalOrders++;updateLevel();toast('📦 Заказ выполнен: +'+o.money+' 💰 и +'+o.research+' 🔬');save()}function renderOrders(){const e=document.getElementById('ordersPanel');if(!e)return;ensureOrders();e.innerHTML='<div class="section-head"><span class="eyebrow">ЗАКАЗЫ</span><h3>Запросы лабораторий</h3><p>Заказы платят лучше обычной продажи. Решай, что выгоднее: продать сейчас или придержать материал.</p></div>'+s.orders.active.map((o,i)=>{const done=!!s.orders.claimed[o.id],need=o.req.map(([k,q])=>icon(k)+' '+label(k)+' × '+q).join(' + ');return '<div class="panel '+(done?'task-done':'')+'"><span>📦</span><div><b>'+o.title+'</b><small>'+need+' → <strong>+'+o.money+' 💰</strong> + <strong>'+o.research+' 🔬</strong></small></div><button class="secondary" data-order="'+i+'" '+(done?'disabled':'')+'>'+(done?'Выполнено':'Выполнить')+'</button></div>'}).join('')+'<div class="notice">Заказы обновляются каждый день. Их награды специально выше обычной продажи, чтобы появился выбор.</div>';e.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>fulfillOrder(Number(b.dataset.order)))}function eventDefs(){return [{id:'mutation',title:'🧬 Неожиданная мутация',text:'В одном из образцов появилась нестабильная структура. Можно рискнуть и изучить её.',choices:[['study','🔬 Изучить за 20 науки'],['sell','💰 Продать образец за 90 денег'],['discard','🗑️ Утилизировать']]},{id:'buyer',title:'💰 Срочный покупатель',text:'Частная лаборатория готова прямо сейчас купить 10 крови по повышенной цене.',choices:[['sell','Продать 10 крови за 220 денег'],['decline','Отказаться']]},{id:'equipment',title:'⚡ Перегрузка оборудования',text:'Инкубатор работает нестабильно. Есть шанс получить больше материала, но можно потерять часть партии.',choices:[['risk','⚡ Рискнуть'],['safe','🛡️ Отключить оборудование']]},{id:'sample',title:'🧫 Странный образец',text:'Автоматический анализ обнаружил неизвестную клеточную структуру.',choices:[['analyze','🔬 Провести анализ за 15 науки'],['store','📦 Сохранить образец'],['discard','🗑️ Утилизировать']]}]}function maybeEvent(){if(s.event.id&&Date.now()<s.event.expires)return;if(s.event.id&&Date.now()>=s.event.expires){s.event={id:'',expires:0};render()}if(Math.random()<0.025){const d=eventDefs()[Math.floor(Math.random()*eventDefs().length)];s.event={id:d.id,expires:Date.now()+90000};render()}}function resolveEvent(choice){const id=s.event.id;if(!id)return;const close=()=>{s.event={id:'',expires:0};save()};if(id==='mutation'){if(choice==='study'){if(s.research<20)return toast('Нужно 20 науки');s.research-=20;if(Math.random()<.65){const pool=['reagent','dna','bioenergy'];const k=pool[Math.floor(Math.random()*pool.length)];addResource(k,1);discover(k);toast('🧬 Анализ удался: +1 '+label(k))}else toast('🧬 Структура разрушилась')}else if(choice==='sell'){s.money+=90;toast('💰 Образец продан')}else toast('🗑️ Образец утилизирован');close();return}if(id==='buyer'){if(choice==='sell'){if(s.blood<10)return toast('Нужно 10 крови');s.blood-=10;s.money+=220;s.meta.totalSales+=10;toast('💰 Срочный заказ выполнен')}close();return}if(id==='equipment'){if(choice==='risk'){if(Math.random()<.65){addResource('sample',25);toast('⚡ Риск оправдан: +25 образцов')}else{s.sample=Math.max(0,s.sample-10);toast('⚠️ Перегрузка: потеряно 10 образцов')}}else toast('🛡️ Оборудование отключено без потерь');close();return}if(id==='sample'){if(choice==='analyze'){if(s.research<15)return toast('Нужно 15 науки');s.research-=15;if(Math.random()<.7){addResource('dna',1);discover('dna');toast('🔬 Анализ обнаружил ДНК')}else toast('🔬 Анализ ничего не дал')}else if(choice==='store'){if(addResource('sample',1)<1)return toast('Нет места на складе');toast('📦 Образец сохранён')}else toast('🗑️ Образец утилизирован');close()}}function renderEvent(){const e=document.getElementById('eventPanel');if(!e)return;const d=eventDefs().find(x=>x.id===s.event.id);if(!d||Date.now()>=s.event.expires){e.innerHTML='';return}e.innerHTML='<div class="event-card"><div class="section-head"><span class="eyebrow">СЛУЧАЙНАЯ СИТУАЦИЯ</span><h3>'+d.title+'</h3><p>'+d.text+'</p></div><div class="event-actions">'+d.choices.map(c=>'<button class="secondary" data-event="'+c[0]+'">'+c[1]+'</button>').join('')+'<small>Ситуация исчезнет через 90 секунд.</small></div></div>';e.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>resolveEvent(b.dataset.event))}function renderTasks(){")
          rep("renderTasks()}function renderCollection()", "renderTasks();renderOrders();renderEvent()}function renderCollection()")
          rep("function render(){renderTop();", "function render(){renderTop();")
          rep("renderEcho();renderTech();renderFortune();renderCollection()}", "renderEcho();renderTech();renderFortune();renderCollection();renderOrders();renderEvent()}")
          rep("function tick(){const now=Date.now(),dt=", "function tick(){const now=Date.now(),dt=")
          rep("if(document.visibilityState==='visible'){prodAccumulator=", "if(document.visibilityState==='visible'){maybeEvent();prodAccumulator=")
          rep("function prestige(){", "async function destroyLab(){if(!confirm('⚠️ Уничтожить текущую лабораторию? Все деньги, материалы, аппараты, технологии, задания, заказы, бонусы, престиж и Проект Эхо будут сброшены. Сохранится только статистика прошлых лабораторий.'))return;if(!confirm('Это действие нельзя отменить. Начать лабораторию с нуля?'))return;const meta=clone(s.meta||base.meta);meta.resets=(meta.resets||0)+1;meta.bestLevel=Math.max(meta.bestLevel||1,s.labLevel||1);s=clone(base);s.meta=meta;s.lastSave=Date.now();s.lastOffline=s.lastSave;selected=[];await save();toast('🧪 Новая лаборатория создана')}function prestige(){")
          rep("prestigeBtn.onclick=prestige;", "prestigeBtn.onclick=prestige;resetLabBtn.onclick=destroyLab;")
          rep("<style>.topbar", "<style>.danger-btn{border-color:#8b4b58!important}.event-card{border:1px solid #6a5b35;border-radius:16px;background:#171827;padding:14px;margin-top:10px}.event-actions{display:grid;gap:7px}.event-actions small{color:#8f9ab5;text-align:center}.task-done{opacity:.7}.topbar")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate HTML and JavaScript structure
        run: |
          test -s index.html
          grep -q "Новая лаборатория" index.html
          grep -q "Запросы лабораторий" index.html
          grep -q "СЛУЧАЙНАЯ СИТУАЦИЯ" index.html
          grep -q "little_laboratory_v18" index.html
      - name: Commit feature update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add lab reset orders and random events' || exit 0
          git push
