name: v1.7 Echo clean patch
on:
  push:
    branches: [v1.7]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.7
          fetch-depth: 0
      - name: Patch Echo trigger and asset
        run: python3 .github/echo_patch.py
      - name: Verify JavaScript before commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          x=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.I|re.S)
          Path('/tmp/game.js').write_text('\n\n'.join(v for v in x if v.strip()),encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(v1.7): make Echo auto-trigger on final component"
          git push origin HEAD:v1.7
