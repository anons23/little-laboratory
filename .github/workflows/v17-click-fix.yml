name: v1.7 click fix
on:
  push:
    branches: [v1.7]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1.7
          fetch-depth: 0
      - name: Patch click safety
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('style.css')
          css=p.read_text(encoding='utf-8')
          marker='/* V1_7_CLICK_SAFETY */'
          if marker not in css:
              css += '\n'+marker+'\nbutton,.nav-item,.resource,[role="button"]{pointer-events:auto!important;touch-action:manipulation!important}\n.screen:before{pointer-events:none!important}\n'
              p.write_text(css,encoding='utf-8')
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          marker='/* V1_7_CLICK_DELEGATION */'
          if marker not in html:
              script='''<script>/* V1_7_CLICK_DELEGATION */\n(function(){\n  document.addEventListener('click',function(e){\n    const el=e.target&&e.target.closest?e.target.closest('button,[data-screen]'):null;\n    if(!el)return;\n    try{\n      const screen=el.getAttribute('data-screen');\n      if(screen&&typeof window.setScreen==='function'){e.preventDefault();window.setScreen(screen);return;}\n      if(el.id==='continueBtn'&&typeof window.setScreen==='function'){e.preventDefault();window.setScreen('lab');return;}\n      if(el.id==='storyArchiveBackBtn'&&typeof window.setScreen==='function'){e.preventDefault();window.setScreen('home');return;}\n    }catch(err){console.error('click delegation',err)}\n  },true);\n})();</script>\n'''
              html=html.replace('</body>',script+'</body>')
              p.write_text(html,encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(v1.7): restore browser click interaction'
          git push origin HEAD:v1.7
