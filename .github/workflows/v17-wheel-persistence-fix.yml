name: v1.7 wheel persistence fix
on:
  push:
    branches: [v1.7]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wheel persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_start=s.index('function startWheelSpin(ad)')
          old_end=s.index('const adDefs=',old_start)
          old=s[old_start:old_end]
          new="""function startWheelSpin(ad){if(wheelBusy)return;wheelBusy=true;if(ad)s.fortuneAds++;else s.fortuneFree--;const pool=wheelPool(),k=weightedWheel();s.wheelPending={k:k,ad:!!ad,startedAt:nowMs()};localStorage.setItem(KEY,JSON.stringify(s));let idx=pool.findIndex(x=>x[0]===k);if(idx<0)idx=pool.length-1;const seg=360/pool.length,center=(idx+.5)*seg;const visual=document.getElementById('wheelVisual');if(!visual){wheelBusy=false;return doSpinResult(k,ad)}const turns=5+Math.floor(Math.random()*3);const cur=((wheelAngle%360)+360)%360;const delta=((360-center-cur)%360+360)%360;wheelAngle+=turns*360+delta;visual.style.transition='transform 2.3s cubic-bezier(.12,.75,.12,1)';visual.style.transform='rotate('+wheelAngle+'deg)';setTimeout(()=>{doSpinResult(k,ad);wheelBusy=false;renderFortune()},2350)}async function rewarded(fn){if(adBusy)return toast('Реклама уже запущена');if(!ysdk?.adv?.showRewardedVideo)return toast('Реклама сейчас недоступна');adBusy=true;ysdk.features?.GameplayAPI?.stop?.();let rewardedOnce=false;const reward=()=>{if(rewardedOnce)return;rewardedOnce=true;try{fn()}catch(err){console.error(err);toast('Ошибка выдачи награды')}};try{await ysdk.adv.showRewardedVideo({callbacks:{onRewarded:reward}})}catch{toast('Реклама сейчас недоступна')}finally{adBusy=false;ysdk.features?.GameplayAPI?.start?.()}}let wheelBusy=false,lastWheelMsg=\"Нажми на колесо\";async function doSpinResult(k,ad){s.wheelPending=null;if(k==='nothing'){lastWheelMsg='💨 Пустой сектор — в этот раз ничего';toast('🎡 В этот раз — пустой сектор. Повезёт в следующий раз!');save(false,true);return}if(addResource(k,1)<1){if(ad)s.fortuneAds--;else s.fortuneFree++;lastWheelMsg='📦 Нет места на складе';localStorage.setItem(KEY,JSON.stringify(s));return toast('Нет места на складе')}discover(k);lastWheelMsg='🎉 Выигрыш: '+icon(k)+' '+label(k);toast(lastWheelMsg);const e=document.getElementById('wheelReward');if(e){e.textContent=lastWheelMsg;e.classList.add('winner')}save(false,true)}function settleWheelPending(){const p=s.wheelPending;if(!p||typeof p.k!=='string'){s.wheelPending=null;return}const ad=!!p.ad;const k=p.k;s.wheelPending=null;if(k==='nothing'){save(false,true);return}if(addResource(k,1)<1){if(ad)s.fortuneAds=Math.max(0,(s.fortuneAds|0)-1);else s.fortuneFree=(s.fortuneFree|0)+1;save(false,true);return}discover(k);lastWheelMsg='🎉 Выигрыш восстановлен: '+icon(k)+' '+label(k);save(false,true);toast(lastWheelMsg)}"""
          if old.count('function startWheelSpin(ad)')!=1: raise SystemExit('wheel function not found')
          s=s[:old_start]+new+s[old_end:]
          marker='ensureStateShape();render();'
          if marker not in s: raise SystemExit('load render marker not found')
          s=s.replace(marker,'ensureStateShape();settleWheelPending();render();',1)
          p.write_text(s)
          PY
      - name: Validate and cleanup
        run: |
          python3 tests/test_game_integrity.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert s.count('function settleWheelPending')==1
          assert 's.wheelPending={k:k,ad:!!ad,startedAt:nowMs()}' in s
          assert 'settleWheelPending();render();' in s
          js=re.search(r'<script>(.*?)</script>',s,re.S)
          assert js, 'inline script missing'
          Path('/tmp/game.js').write_text(js.group(1))
          PY
          node --check /tmp/game.js
          rm -f wheel-audit.txt .github/workflows/v17-wheel-persistence-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html wheel-audit.txt .github/workflows/v17-wheel-persistence-fix.yml
          git commit -m 'fix: make wheel spins crash-safe' || true
          git push