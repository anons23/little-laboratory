name: v1.7 wheel report
on:
  push:
    branches: [v1.7]
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          needles=['function startWheelSpin','startWheelSpin(','fortuneAds','fortuneFree','fortuneDay','function spinWheel','showRewarded','onRewarded']
          out=[]
          for n in needles:
              pos=0; hits=0
              while True:
                  pos=s.find(n,pos)
                  if pos<0 or hits>=8: break
                  out += ['\n### '+n, s[max(0,pos-1200):min(len(s),pos+3000)]]
                  pos+=len(n); hits+=1
          Path('wheel-audit.txt').write_text('\n'.join(out))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wheel-audit.txt
          git commit -m 'chore: capture wheel flow report'
          git push
      - name: Remove report workflow
        run: |
          rm -f .github/workflows/v17-wheel-report.yml
          git add .github/workflows/v17-wheel-report.yml
          git commit -m 'chore: remove temporary wheel report workflow'
          git push