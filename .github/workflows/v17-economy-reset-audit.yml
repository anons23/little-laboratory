name: v1.7 economy reset audit
on:
  workflow_dispatch:
  push:
    branches: [v1.7]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1.7
      - name: Audit source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          required=[
            'function prestige()',
            'function ensureStateShape()',
            'SAVE_SCHEMA_VERSION=19',
            'adCounts:clone(s.adCounts||base.adCounts)',
            'fortuneFree:s.fortuneFree',
            'fortuneAds:s.fortuneAds',
            'adWarehouseUntil:s.adWarehouseUntil',
            'adDiscountUntil:s.adDiscountUntil',
            'adProductionUntil:s.adProductionUntil',
            'tech:clone(base.tech),tasks:clone(base.tasks),adCounts:clone(base.adCounts)',
            'await save(false,true)',
          ]
          missing=[x for x in required if x not in h]
          if missing: raise SystemExit('Missing reset invariant(s): '+repr(missing))
          # Critical reset must rebuild state from base, not mutate selected nested objects in place.
          m=re.search(r'function (?:doDestroyLab|destroyLab|resetLab)\([^)]*\)',h)
          print('Destroy/reset entrypoint:', m.group(0) if m else 'not found; no named destroyLab/resetLab function')
          # Prestige must preserve meta/history and daily/ad limits while resetting progression.
          for x in ['const meta=clone(s.meta||base.meta)','meta.resets=(meta.resets||0)+1','meta.bestLevel=Math.max(meta.bestLevel||1,s.labLevel||1)']:
            if x not in h: raise SystemExit('Prestige history invariant missing: '+x)
          print('Economy/reset invariants OK')
          PY
      - name: JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',h,re.I|re.S)
          Path('/tmp/game.js').write_text('\\n\\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Run integrity tests
        run: python3 tests/test_game_integrity.py
      - name: Add reset assertions to integrity tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/test_game_integrity.py')
          s=p.read_text(encoding='utf-8')
          marker='def test_reset_recreates_task_and_ad_state():'
          if marker not in s: raise SystemExit('test marker not found')
          if 'def test_prestige_preserves_history_and_flushes_cloud_save():' not in s:
            s += '''\\n\\ndef test_prestige_preserves_history_and_flushes_cloud_save():\\n    assert "const meta=clone(s.meta||base.meta)" in HTML\\n    assert "meta.resets=(meta.resets||0)+1" in HTML\\n    assert "meta.bestLevel=Math.max(meta.bestLevel||0,s.labLevel||1)" in HTML or "meta.bestLevel=Math.max(meta.bestLevel||1,s.labLevel||1)" in HTML\\n    assert "await save(false,true)" in HTML\\n\\n\\ndef test_critical_reset_preserves_daily_limits_and_rebuilds_nested_state():\\n    assert "adCounts:clone(s.adCounts||base.adCounts)" in HTML\\n    assert "tech:clone(base.tech),tasks:clone(base.tasks),adCounts:clone(base.adCounts)" in HTML\\n    assert "selected=[];" in HTML\\n'''
            p.write_text(s,encoding='utf-8')
          PY
      - name: Re-run integrity tests
        run: python3 tests/test_game_integrity.py
      - name: Commit tests and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_game_integrity.py
          git commit -m "test: cover prestige and reset invariants" || true
          git push origin HEAD:v1.7
          git rm .github/workflows/v17-economy-reset-audit.yml
          git commit -m "chore: remove temporary economy audit workflow"
          git push origin HEAD:v1.7
