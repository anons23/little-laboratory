# Deploy the v1.7 browser build to GitHub Pages
name: Deploy v1.7 to GitHub Pages

on:
  push:
    branches: ["v1.7"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-v1-7"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.7
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload v1.7 artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy v1.7 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
