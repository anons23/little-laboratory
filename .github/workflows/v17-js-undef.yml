name: v1.7 JS undefined-global audit

on:
  workflow_dispatch:
  push:
    branches: [v1.7]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract inline JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.I|re.S)
          Path('/tmp/game-inline.js').write_text('\n\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
      - name: Run no-undef audit
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save eslint@9 >/dev/null 2>&1
          cat > eslint.config.mjs <<'JS'
          export default [{languageOptions:{ecmaVersion:'latest',sourceType:'script',globals:{window:'readonly',document:'readonly',console:'readonly',localStorage:'readonly',sessionStorage:'readonly',confirm:'readonly',alert:'readonly',Date:'readonly',Math:'readonly',JSON:'readonly',Promise:'readonly',setTimeout:'readonly',clearTimeout:'readonly',setInterval:'readonly',clearInterval:'readonly',requestAnimationFrame:'readonly',navigator:'readonly',location:'readonly',Element:'readonly',HTMLElement:'readonly',Node:'readonly',performance:'readonly',URL:'readonly',URLSearchParams:'readonly',structuredClone:'readonly',fetch:'readonly',YaGames:'readonly',ysdk:'writable'}},rules:{'no-undef':'error'}}];
          JS
          npx eslint /tmp/game-inline.js --config eslint.config.mjs
