name: v1.7 Echo auto-trigger retry
on:
  push:
    branches: [v1.7]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Echo auto-trigger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='V1_7_ECHO_AUTOTRIGGER'
          if marker not in s:
              code='''<script>/* V1_7_ECHO_AUTOTRIGGER */\n(function(){\n  const KEY="little_laboratory_v19";\n  const req=["regen","matrix","mdna","bioenergy","heart","adaptedHeart","stableHeart"];\n  let busy=false;\n  function trigger(){\n    if(busy)return;\n    try{\n      const st=JSON.parse(localStorage.getItem(KEY)||"null");\n      if(!st||!(st.tech&&st.tech.echo)||st.echoDone||!req.every(k=>(st[k]|0)>=1))return;\n      const fin=document.getElementById("echoFinishSlot");\n      if(!fin)return;\n      busy=true; fin.click(); setTimeout(()=>busy=false,3000);\n    }catch(e){}\n  }\n  setInterval(trigger,500);\n  document.addEventListener("visibilitychange",trigger);\n})();\n</script>'''
              s=s.replace('</body>',code+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflows
        run: rm -f .github/workflows/v17-echo-autotrigger.yml .github/workflows/v17-echo-autotrigger2.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/v17-echo-autotrigger.yml .github/workflows/v17-echo-autotrigger2.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(v1.7): robust automatic Echo trigger"
          git push origin HEAD:v1.7