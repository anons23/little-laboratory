name: v1.7 runtime stability fixes

on:
  push:
    branches: [v1.7]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          orig=s
          # Server-synchronised clock for Yandex daily limits/timers, with local fallback.
          marker="let ysdk=null,player=null,lastTick=Date.now(),prodAccumulator=0,sound=true,selected=[],saveTimer=0,marketMode='sell',adBusy=false;"
          repl=marker+"function nowMs(){return typeof ysdk?.serverTime==='function'?ysdk.serverTime():Date.now()}let gamePaused=false;"
          if marker in s and "function nowMs()" not in s:
              s=s.replace(marker,repl,1)
              # Keep the helper's fallback on Date.now while moving all game clocks to server time when available.
              s=s.replace("function nowMs(){return typeof ysdk?.serverTime==='function'?ysdk.serverTime():Date.now()}","function nowMs(){return typeof ysdk?.serverTime==='function'?ysdk.serverTime():Date.now()}",1)
              # Replace game time reads, but restore the helper fallback if the broad replacement touches it.
              before=s.index("function nowMs()")
              head=s[:before]
              tail=s[before:]
              tail=tail.replace("Date.now()","__LOCAL_NOW__",1)
              head=head.replace("Date.now()","nowMs()")
              tail=tail.replace("Date.now()","nowMs()")
              tail=tail.replace("__LOCAL_NOW__","Date.now()",1)
              s=head+tail
          # Expired random events must not permanently block future events.
          old="function maybeEvent(dt){if(s.event&&s.event.id)return;const now=Date.now();"
          new="function maybeEvent(dt){const now=nowMs();if(s.event&&s.event.id&&num(s.event.expires)>now)return;if(s.event&&s.event.id){s.event={id:'',expires:0};}"
          s=s.replace(old,new,1)
          # Count offline production toward production tasks using the actual stored amount.
          old="for(const k in p)if(p[k]>0)gained+=addResource(k,p[k]*away);s.energy=Math.min(150,s.energy+away*.08);return gained"
          new="for(const k in p)if(p[k]>0){const got=addResource(k,p[k]*away);gained+=got;if(s.tasks)s.tasks.produce=(s.tasks.produce|0)+got}s.energy=Math.min(150,s.energy+away*.08);return gained"
          s=s.replace(old,new,1)
          # Installed Echo components were already removed from storage; do not subtract them twice from capacity usage.
          old="for(const k in s.installed)if(s.installed[k]===1)u--;return Math.max(0,u)"
          new="return Math.max(0,u)"
          s=s.replace(old,new,1)
          # Do not hit Yandex setData rate limits on every local save; queued writes are the SDK-recommended mode.
          s=s.replace("await player.setData(s,true)","await player.setData(s,false)",1)
          # Reset must recreate complete daily/task/ad state, not empty objects.
          old="tech:{},tasks:{},adCounts:{},adWarehouseUntil:0"
          new="tech:clone(base.tech),tasks:clone(base.tasks),adCounts:clone(base.adCounts),adWarehouseUntil:0"
          s=s.replace(old,new,1)
          # Pause gameplay during Yandex pause/resume events and while rewarded ads are displayed.
          s=s.replace("if(document.visibilityState==='visible'){try{maybeEvent(dt)}", "if(document.visibilityState==='visible'&&!gamePaused){try{maybeEvent(dt)}",1)
          old="async function rewarded(fn){if(adBusy)return toast('Реклама уже запущена');"
          new="async function rewarded(fn){if(adBusy)return toast('Реклама уже запущена');"
          # Insert GameplayAPI stop/start around the ad promise without changing reward semantics.
          old2="adBusy=true;let rewardedOnce=false;const reward=()=>"
          new2="adBusy=true;ysdk.features?.GameplayAPI?.stop?.();let rewardedOnce=false;const reward=()=>"
          s=s.replace(old2,new2,1)
          old3="}finally{adBusy=false}}let wheelBusy=false"
          new3="}finally{adBusy=false;ysdk.features?.GameplayAPI?.start?.()}}let wheelBusy=false"
          s=s.replace(old3,new3,1)
          # Wire Yandex gameplay markup and Game Ready once SDK/player initialization completes.
          old4="await load();try{bindLabTabs();bindMarketTabs();render()}catch(e){console.error(e)}})();"
          new4="await load();try{ysdk?.features?.LoadingAPI?.ready?.();ysdk?.features?.GameplayAPI?.start?.();ysdk?.on?.('game_api_pause',()=>{gamePaused=true;save(false,false)});ysdk?.on?.('game_api_resume',()=>{gamePaused=false;lastTick=nowMs();render()})}catch(e){console.error(e)}try{bindLabTabs();bindMarketTabs();render()}catch(e){console.error(e)}})();"
          s=s.replace(old4,new4,1)
          # Add an explicit touch/context-menu guard required for mobile moderation and long-press UX.
          end="</style></head>"
          css="body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}input,textarea{user-select:text;-webkit-user-select:text}"
          if css not in s:
              s=s.replace(end,css+end,1)
          if s==orig:
              raise SystemExit('No runtime patch applied')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Extend integrity tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/test_game_integrity.py')
          s=p.read_text(encoding='utf-8')
          add='''\n\ndef test_runtime_stability_and_yandex_gameplay_markup():\n    assert "function nowMs()" in HTML\n    assert "ysdk?.serverTime" in HTML\n    assert "if(s.event&&s.event.id&&num(s.event.expires)>now)return" in HTML\n    assert "s.tasks.produce=(s.tasks.produce|0)+got" in HTML\n    assert "await player.setData(s,false)" in HTML\n    assert "GameplayAPI?.stop?.()" in HTML\n    assert "LoadingAPI?.ready?.()" in HTML\n    assert "game_api_pause" in HTML and "game_api_resume" in HTML\n    assert "overscroll-behavior:none" in HTML\n\n\ndef test_reset_recreates_task_and_ad_state():\n    assert "tech:clone(base.tech),tasks:clone(base.tasks),adCounts:clone(base.adCounts)" in HTML\n'''
          if 'test_runtime_stability_and_yandex_gameplay_markup' not in s:
              p.write_text(s.rstrip()+add+'\n',encoding='utf-8')
          PY
          python3 tests/test_game_integrity.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,re.I|re.S)
          Path('/tmp/game-inline.js').write_text('\\n\\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/game-inline.js
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/test_game_integrity.py
          git diff --cached --quiet && exit 0
          git commit -m 'Apply v1.7 runtime stability fixes [runtime-fixed]'
          git push
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/v17-runtime-fixes.yml
          git commit -m 'Remove runtime fix workflow [runtime-fixed]'
          git push
