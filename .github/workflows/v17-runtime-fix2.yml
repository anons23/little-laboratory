name: v1.7 runtime fix 2
on:
  push:
    branches: [v1.7]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1.7
          fetch-depth: 0
      - name: Patch index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          html2 = re.sub(r'async\s*\n\s*function bindResetProtocol', 'function bindResetProtocol', html, count=1)
          if html2 == html:
              raise SystemExit('runtime blocker pattern not found')
          p.write_text(html2, encoding='utf-8')
          PY
          rm -f .github/workflows/v17-runtime-fix2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/v17-runtime-fix2.yml
          git commit -m 'fix(v1.7): remove runtime blocker before initialization'
          git push origin HEAD:v1.7
