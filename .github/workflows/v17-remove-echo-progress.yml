name: V1.7 Remove Duplicate Echo Progress
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.7
      - name: Remove duplicate Echo progress panel
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          original = html
          html, n1 = re.subn(r"renderEchoProgress\(\);", "", html, count=1)
          html, n2 = re.subn(r"\n\s*function renderEchoProgress\(\)\{.*?\n\s*\}\n(?=\s*function renderNow\()", "\n", html, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit(f'expected 1 renderEchoProgress() call, found {n1}')
          if n2 != 1:
              raise SystemExit(f'expected 1 renderEchoProgress function, found {n2}')
          if html == original:
              raise SystemExit('index.html was not changed')
          p.write_text(html, encoding='utf-8')
          print(f'removed call={n1}, function={n2}')
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S|re.I)
          js='\n'.join(s for s in scripts if s.strip())
          Path('/tmp/game.js').write_text(js, encoding='utf-8')
          subprocess.run(['node','--check','/tmp/game.js'],check=True)
          assert 'function renderEchoProgress' not in html
          assert 'renderEchoProgress();' not in html
          print('Duplicate Echo progress panel removed')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(v1.7): remove duplicate Echo progress panel'
          git push origin HEAD:v1.7
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/v17-remove-echo-progress.yml
          git add -A
          git diff --cached --quiet || git commit -m 'chore(v1.7): remove temporary Echo progress workflow'
          git push origin HEAD:v1.7
