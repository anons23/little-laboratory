name: v1.7 runtime fix
on:
  push:
    branches: [v1.7]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1.7
          fetch-depth: 0
      - name: Patch runtime blocker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          old = 'async \\nfunction bindResetProtocol'
          if old in html:
              html = html.replace(old, 'function bindResetProtocol', 1)
          else:
              html2 = re.sub(r'async\\s*\\n\\s*function bindResetProtocol', 'function bindResetProtocol', html, count=1)
              if html2 != html:
                  html = html2
          p.write_text(html, encoding='utf-8')
          PY
          rm -f .github/workflows/v17-runtime-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/v17-runtime-fix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(v1.7): remove runtime blocker before initialization'
          git push origin HEAD:v1.7
