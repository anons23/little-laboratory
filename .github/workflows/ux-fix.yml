name: UX Fix
on:
  push:
    paths:
      - '.github/workflows/ux-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div id="game">'
          new='<div id="onboarding" class="onboarding hidden"><div class="onboarding-card"><div class="onboarding-step" id="onboardingStep"></div><button id="onboardingNext" class="primary big">Начать</button></div></div><div id="game">'
          assert old in s and 'id="onboarding"' not in s
          s=s.replace(old,new,1)
          old='</style></head>'
          new='''.onboarding{position:fixed;inset:0;z-index:1000;background:#0b1020ee;display:grid;place-items:center;padding:20px}.onboarding.hidden{display:none}.onboarding-card{width:min(520px,100%);box-sizing:border-box;padding:24px;border:1px solid #34405f;border-radius:22px;background:#111a2f;box-shadow:0 20px 60px #000b}.onboarding-card h2{margin:0 0 10px;font-size:25px}.onboarding-card p{color:#aeb8d0;line-height:1.55;margin:10px 0}.onboarding-card .guide{display:grid;gap:9px;margin:16px 0}.onboarding-card .guide div{padding:11px 12px;border-radius:13px;background:#151e35;border:1px solid #293653}.onboarding-card .muted{color:#8f9ab5}.onboarding-card button{width:100%}</style></head>'''
          assert old in s
          s=s.replace(old,new,1)
          old='<p>Собирай биологические материалы, смешивай неизвестные компоненты и раскрывай цепочки реакций. Здесь эксперимент важнее готового рецепта.</p><button id="continueBtn" class="primary big">В лабораторию</button>'
          new='<p>Ты получил маленькую биолабораторию. Твоя задача — развивать её, открывать новые реакции и постепенно собрать Проект Эхо.</p><button id="continueBtn" class="primary big">В лабораторию</button>'
          assert old in s
          s=s.replace(old,new,1)
          old='version:18,money:120'
          new='version:18,introSeen:false,money:120'
          assert old in s
          s=s.replace(old,new,1)
          old="for(const k of ['money','research','energy','capacity','labLevel','prestige','lastSave','lastOffline','adWarehouseUntil','adDiscountUntil','adProductionUntil'])if(k in x)z[k]=Math.max(0,num(x[k]));"
          new="z.introSeen=x.introSeen===true;for(const k of ['money','research','energy','capacity','labLevel','prestige','lastSave','lastOffline','adWarehouseUntil','adDiscountUntil','adProductionUntil'])if(k in x)z[k]=Math.max(0,num(x[k]));"
          assert old in s
          s=s.replace(old,new,1)
          old="function render(){renderTop();const goal=s.labLevel<2?'Проведи эксперименты и набери 100 науки.'"
          new="function renderOnboarding(){const e=document.getElementById('onboarding'),step=document.getElementById('onboardingStep'),btn=document.getElementById('onboardingNext');if(!e||!step||!btn)return;if(s.introSeen){e.classList.add('hidden');return}e.classList.remove('hidden');const n=Number(e.dataset.step||'0');if(n===0){step.innerHTML='<div class=\"eyebrow\">ДОБРО ПОЖАЛОВАТЬ</div><h2>Твоя лаборатория начинается с нуля</h2><p>Ты унаследовал небольшую биолабораторию. Здесь нет готовых рецептов: материалы нужно получать, сочетать и изучать.</p><div class=\"guide\"><div>🧫 <b>1. Получай материалы</b><br><span class=\"muted\">Инкубатор автоматически производит образцы.</span></div><div>🧪 <b>2. Экспериментируй</b><br><span class=\"muted\">На столе выбирай 2 компонента и проверяй их сочетание.</span></div><div>🔬 <b>3. Развивайся</b><br><span class=\"muted\">Продавай лишнее, покупай нужное, открывай технологии и новые аппараты.</span></div></div><p><b>Первая цель:</b> проведи первый эксперимент.</p>' ;btn.textContent='Понятно, начать';}else if(n===1){step.innerHTML='<div class=\"eyebrow\">ПЕРВЫЕ ШАГИ</div><h2>Не нужно изучать всё сразу</h2><p>В начале тебе достаточно трёх экранов:</p><div class=\"guide\"><div>⚗️ <b>Лаборатория</b> — материалы, экспериментальный стол и аппараты.</div><div>🏪 <b>Рынок</b> — продавай излишки и покупай недостающие компоненты.</div><div>🔬 <b>Тех</b> — задания, заказы, технологии и случайные ситуации.</div></div><p class=\"muted\">Остальные разделы открывай по мере развития.</p>';btn.textContent='В лабораторию';}else{step.innerHTML='<div class=\"eyebrow\">ПЕРВАЯ ЦЕЛЬ</div><h2>Начни с простого эксперимента</h2><p>Открой «Лаборатория» → «Стол», выбери два доступных компонента и нажми «Провести эксперимент».</p><div class=\"guide\"><div>💡 Не бойся неудач: неизвестные сочетания — часть игры.</div><div>📖 Удачные реакции попадают в Архив и открывают путь к новым компонентам.</div></div>';btn.textContent='Начать исследование';}btn.onclick=()=>{if(n<2){e.dataset.step=String(n+1);return}s.introSeen=true;e.classList.add('hidden');save();setScreen('lab')}}function render(){renderTop();const goal=s.labLevel<2?'Проведи эксперименты и набери 100 науки.'"
          assert old in s
          s=s.replace(old,new,1)
          old='renderAdBonuses();renderWarehouse();'
          new='renderOnboarding();renderAdBonuses();renderWarehouse();'
          assert old in s
          s=s.replace(old,new,1)
          old='background:conic-gradient(#7c5cff 0 36deg,#293552 36deg 72deg,#4b8dff 72deg 108deg,#293552 108deg 144deg,#7c5cff 144deg 180deg,#293552 180deg 216deg,#4b8dff 216deg 252deg,#293552 252deg 288deg,#7c5cff 288deg 324deg,#293552 324deg 360deg)'
          new='background:conic-gradient(#7c5cff 0 36deg,#4b8dff 36deg 72deg,#7c5cff 72deg 108deg,#4b8dff 108deg 144deg,#7c5cff 144deg 180deg,#4b8dff 180deg 216deg,#7c5cff 216deg 252deg,#4b8dff 252deg 288deg,#7c5cff 288deg 324deg,#293552 324deg 360deg)'
          assert old in s
          s=s.replace(old,new,1)
          old="const pool=[['sample',45],['blood',25],['reagent',15],['dna',8],['bioenergy',4],['serum',2],['crystal',.8],['gel',.15],['matrix',.04],['stableHeart',.001]];"
          new="const pool=[['sample',43],['blood',23],['reagent',14],['dna',8],['bioenergy',4],['serum',2.5],['crystal',.8],['gel',.15],['matrix',.05],['stableHeart',.001],['nothing',4.499]];"
          assert old in s
          s=s.replace(old,new,1)
          old='function doSpinResult(k,ad){if(addResource(k,1)<1){'
          new="function doSpinResult(k,ad){if(k==='nothing'){toast('🎡 В этот раз — пустой сектор. Повезёт в следующий раз!');save();return}if(addResource(k,1)<1){"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'Твоя лаборатория начинается с нуля' index.html
          grep -q "\['nothing',4.499\]" index.html
          grep -q 'introSeen' index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'feat: add onboarding and rebalance fortune wheel'
          git push
