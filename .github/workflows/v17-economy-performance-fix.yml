name: v1.7 economy offline performance fix
on:
  push:
    branches: [v1.7]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1.7
      - name: Patch game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          def extract(src,name):
              start=src.find('function '+name+'(')
              if start<0: raise SystemExit('missing '+name)
              i=src.find('{',start); depth=0; quote=None; esc=False
              while i<len(src):
                  c=src[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return start,i+1,src[start:i+1]
                  i+=1
              raise SystemExit('unclosed '+name)
          start,end,old=extract(s,'renderProduction')
          new="""function renderProduction(){try{const p=production();const lines=Object.keys(p).filter(k=>p[k]>0.0001).map(k=>({k:k,rate:p[k],text:icon(k)+' '+label(k)+': +'+(Math.round(p[k]*100)/100)+'/сек'}));const key=lines.map(l=>l.k+':'+l.rate).join('|');const pr=document.getElementById('prodRate');const more=Math.max(0,lines.length-1);if(pr&&pr.dataset.rateKey!==key){pr.dataset.rateKey=key;if(lines.length){pr.innerHTML=lines[0].text+(more?(' · <button type=\"button\" id=\"prodMoreBtn\" class=\"prod-more-btn\">ещё '+more+' ▾</button>'):'')}else{pr.textContent='+0 / сек';pr.dataset.rateKey=key}}const list=document.getElementById('productionList');if(list&&list.dataset.rateKey!==key){list.dataset.rateKey=key;if(!lines.length){list.innerHTML='<div class=\"notice\">Купите и улучшайте аппараты</div>';list.classList.add('hidden')}else{list.innerHTML='<div class=\"prod-list-inner\"><b>Всё производство</b>'+lines.map(l=>'<div class=\"prod-line\">'+l.text+'</div>').join('')+'</div>';if(!window.__prodExpanded&&more>0)list.classList.add('hidden');else list.classList.remove('hidden')}}const btn=document.getElementById('prodMoreBtn');if(btn&&!btn.dataset.bound){btn.dataset.bound='1';btn.onclick=function(e){e.preventDefault();e.stopPropagation();window.__prodExpanded=!window.__prodExpanded;const list2=document.getElementById('productionList');if(list2)list2.classList.toggle('hidden',!window.__prodExpanded);btn.textContent=window.__prodExpanded?('ещё '+more+' ▴'):('ещё '+more+' ▾')}}const pp=document.getElementById('prodProgress');if(pp){const acc=(typeof prodAccumulator==='number'?prodAccumulator:0)%1;pp.style.width=(acc*100)+'%'}const mi=document.getElementById('prodTitle');if(mi){const lvl=(s.machines&&s.machines.incubator)|0;mi.textContent=lvl>1?('Инкубатор · ур. '+lvl):'Базовый инкубатор'}const desc=document.getElementById('prodDesc');if(desc)desc.textContent='Производит образцы и ресурсы аппаратов.'}catch(e){console.error(e)}}"""
          s=s[:start]+new+s[end:]
          start,end,old=extract(s,'production')
          new="""function production(){const ad=nowMs()<num(s.adProductionUntil),sig=[s.machines.incubator,s.machines.culture,s.machines.analyzer,s.machines.tissue,s.machines.regenerator,s.machines.synth,s.machines.crystal,s.machines.virusLab,s.prestige,ad?1:0].join(',');if(window.__productionCacheKey===sig&&window.__productionCache)return window.__productionCache;const r={sample:0,blood:0,dna:0,neural:0,bone:0,reagent:0,crystal:0,virus:0};for(const m of machines)r[m[5]]+=(s.machines[m[0]]|0)*m[4];const bonus=(1+(s.prestige|0)*.05)*(ad?2:1);for(const k in r){r[k]*=bonus*0.5;if(k==='sample')r[k]*=0.4}window.__productionCacheKey=sig;window.__productionCache=r;return r}"""
          s=s[:start]+new+s[end:]
          s=s.replace("function today(){const d=new Date();return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate()}","function today(){const d=new Date(nowMs());return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate()}")
          if 'function today(){const d=new Date(nowMs())' not in s: raise SystemExit('today patch failed')
          p.write_text(s,encoding='utf-8')
          
          t=Path('tests/test_game_integrity.py'); ts=t.read_text(encoding='utf-8')
          ts=ts.replace('assert "if(s.event&&s.event.id&&num(s.event.expires)>now)return" in HTML','assert "if(s.event&&s.event.id)return" in HTML')
          marker='def test_critical_reset_preserves_daily_limits_and_rebuilds_nested_state():'
          extra='''def test_offline_and_render_performance_invariants():\n    assert "Math.min(10800,Math.max(0,(nowMs()-num(s.lastOffline))/1000))" in HTML\n    assert "new Date(nowMs())" in HTML\n    assert "pr.dataset.rateKey!==key" in HTML\n    assert "list.dataset.rateKey!==key" in HTML\n    assert "window.__productionCacheKey===sig" in HTML\n\n\n'''
          if 'def test_offline_and_render_performance_invariants():' not in ts:
              ts=ts.replace(marker,extra+marker)
          t.write_text(ts,encoding='utf-8')
          
          import subprocess
          subprocess.run(['python3','tests/test_game_integrity.py'],check=True)
          html=p.read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,re.I|re.S)
          Path('/tmp/game-inline.js').write_text('\\n\\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/game-inline.js'],check=True)
          PY
      - name: Remove temporary tooling and commit
        run: |
          set -euo pipefail
          rm -f v17-loop-report.txt .github/workflows/v17-inspect-loop.yml .github/workflows/v17-economy-performance-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/test_game_integrity.py .github/workflows/v17-inspect-loop.yml .github/workflows/v17-economy-performance-fix.yml v17-loop-report.txt
          git commit -m 'perf: harden offline clock and reduce render churn'
          git push origin v1.7
