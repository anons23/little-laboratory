name: Apply live farming and QA fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            "function maybeEvent(){if(s.event.id&&Date.now()<s.event.expires)return;": "function maybeEvent(dt){if(s.event.id&&Date.now()<s.event.expires)return;",
            "if(Math.random()<(dt/60)*0.03){": "if(Math.random()<(Math.max(0,dt)/60)*0.03){",
            "if(document.visibilityState==='visible'){maybeEvent();prodAccumulator": "if(document.visibilityState==='visible'){maybeEvent(dt);prodAccumulator",
          }
          for a,b in replacements.items():
              if a not in s: raise SystemExit('Pattern not found: '+a[:100])
              s=s.replace(a,b,1)
          old="if(now%10000<1000)renderAdBonuses()"
          new="if(now%10000<1000){renderAdBonuses();if(document.getElementById('lab').classList.contains('active')){renderWarehouse();renderExperiment()}if(document.getElementById('researchScreen').classList.contains('active')){renderTasks();renderOrders();renderEvent()}}"
          if old not in s: raise SystemExit('Live UI refresh pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore live farming tick and live UI refresh'
          git push origin main
