name: v1.7 Echo auto-trigger fix
on:
  push:
    branches: [v1.7]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Echo auto-trigger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* V1_7_ECHO_AUTOTRIGGER */'
          if marker not in s:
              code='''<script>/* V1_7_ECHO_AUTOTRIGGER */\n(function(){\n  const KEY="little_laboratory_v19";\n  const req=["regen","matrix","mdna","bioenergy","heart","adaptedHeart","stableHeart"];\n  let busy=false;\n  function ready(){\n    if(busy)return false;\n    try{\n      const raw=localStorage.getItem(KEY);\n      if(!raw)return false;\n      const st=JSON.parse(raw);\n      if(!st||!(st.tech&&st.tech.echo)||st.echoDone)return false;\n      return req.every(k=>(st[k]|0)>=1);\n    }catch(e){return false}\n  }\n  function trigger(){\n    if(!ready())return;\n    const fin=document.getElementById("echoFinishSlot");\n    if(!fin)return;\n    busy=true;\n    try{fin.click();}catch(e){busy=false;return}\n    setTimeout(function(){busy=false;},3000);\n  }\n  setInterval(trigger,500);\n  document.addEventListener("visibilitychange",trigger);\n})();\n</script>'''
              if '</body>' in s:
                  s=s.replace('</body>',code+'</body>',1)
              else:
                  s+=code
              p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/v17-echo-autotrigger.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/v17-echo-autotrigger.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(v1.7): robust automatic Echo trigger"
          git push