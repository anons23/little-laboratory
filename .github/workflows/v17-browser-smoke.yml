name: v1.7 browser smoke
on:
  workflow_dispatch:
  push:
    branches: [v1.7]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test runner
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
      - name: Smoke test UI interactions
        run: |
          cat > /tmp/smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[]; const consoleErrors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/?smoke=1',{waitUntil:'networkidle'});
            await page.waitForTimeout(1500);
            const result=await page.evaluate(()=>({
              continueVisible:!!document.querySelector('#continueBtn'),
              navCount:document.querySelectorAll('.nav-item').length,
              labButtons:document.querySelectorAll('[data-lab-modal]').length,
              inlineHandlers:[...document.querySelectorAll('button')].filter(b=>b.onclick).length,
              bodyText:document.body.innerText.slice(0,1200)
            }));
            await page.locator('#continueBtn').click();
            await page.waitForTimeout(300);
            const afterContinue=await page.locator('#lab').evaluate(e=>e.classList.contains('active'));
            await page.locator('[data-lab-modal="experiment"]').click();
            await page.waitForTimeout(200);
            const experimentOpen=await page.locator('#labModal').evaluate(e=>!e.classList.contains('hidden'));
            await page.locator('#labModalClose').click();
            await page.locator('[data-screen="market"]').click();
            await page.waitForTimeout(200);
            const marketOpen=await page.locator('#market').evaluate(e=>e.classList.contains('active'));
            console.log(JSON.stringify({result,afterContinue,experimentOpen,marketOpen,errors,consoleErrors},null,2));
            if(errors.length||consoleErrors.length||!afterContinue||!experimentOpen||!marketOpen)process.exitCode=1;
            await browser.close();
          })();
          JS
          node /tmp/smoke.cjs
