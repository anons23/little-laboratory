name: v1.7 browser smoke

on:
  workflow_dispatch:
  push:
    branches: [v1.7]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log
          exit 1
      - name: Browser smoke and button interactions
        run: |
          cat > /tmp/smoke.cjs <<'JS'
          const fs=require('fs');
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR: '+e.stack));
            page.on('console',m=>{if(m.type()==='error') errors.push('CONSOLE: '+m.text())});
            page.on('dialog',d=>d.dismiss());
            await page.goto('http://127.0.0.1:4173/index.html?smoke=1',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(2500);
            const active=()=>page.locator('.screen.active').first();
            const activeId=async()=>await page.evaluate(()=>document.querySelector('.screen.active')?.id||'');
            const results=[];
            async function clickAndCheck(selector,expected){
              const el=page.locator(selector).first();
              if(await el.count()===0) throw new Error('Missing control: '+selector);
              if(!(await el.isVisible())) throw new Error('Hidden control: '+selector);
              await el.click({force:true});
              await page.waitForTimeout(120);
              const got=await activeId();
              results.push(selector+' -> '+got);
              if(expected && got!==expected) throw new Error(selector+' expected screen '+expected+', got '+got);
            }
            if(await page.locator('#continueBtn').count() && await page.locator('#continueBtn').isVisible()) await clickAndCheck('#continueBtn','lab');
            await clickAndCheck('#moneyRes','market');
            await clickAndCheck('#researchRes','researchScreen');
            await clickAndCheck('#samplesRes','lab');
            const home=page.locator('[data-screen="home"]').first();
            if(await home.count() && await home.isVisible()) await clickAndCheck('[data-screen="home"]','home');
            const labTab=page.locator('[data-tab="production"]').first();
            if(await labTab.count() && await labTab.isVisible()){
              await labTab.click({force:true});
              if(!(await labTab.evaluate(e=>e.classList.contains('active')))) throw new Error('Lab production tab did not activate');
              results.push('production tab -> active');
            }
            const marketTab=page.locator('[data-market-tab="sell"]').first();
            if(await marketTab.count() && await marketTab.isVisible()){
              await clickAndCheck('#moneyRes','market');
              await marketTab.click({force:true});
              if(!(await marketTab.evaluate(e=>e.classList.contains('active')))) throw new Error('Market sell tab did not activate');
              results.push('market sell tab -> active');
            }
            const state=await page.evaluate(()=>({active:document.querySelector('.screen.active')?.id||'',buttons:[...document.querySelectorAll('button')].map(b=>({id:b.id,text:(b.innerText||'').trim().slice(0,80),disabled:b.disabled,displayed:!!(b.offsetWidth||b.offsetHeight||b.getClientRects().length),onclick:!!b.onclick}))}));
            const report='RESULTS\n'+results.join('\n')+'\nSTATE\n'+JSON.stringify(state,null,2)+'\nERROR_COUNT '+errors.length+'\n'+errors.join('\n\n');
            fs.writeFileSync('/tmp/browser-report.txt',report);
            console.log(report);
            if(errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e=>{fs.writeFileSync('/tmp/browser-report.txt',String(e.stack||e));console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/smoke.cjs
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-browser-report
          path: /tmp/browser-report.txt
          if-no-files-found: warn
