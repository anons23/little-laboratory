name: v1.7 browser smoke

on:
  workflow_dispatch:
  push:
    branches: [v1.7]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
      - name: Browser smoke
        run: |
          cat > /tmp/smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR: '+e.stack));
            page.on('console',m=>{if(m.type()==='error') errors.push('CONSOLE: '+m.text())});
            page.on('dialog',d=>d.dismiss());
            await page.goto('http://127.0.0.1:4173/index.html?smoke=1',{waitUntil:'networkidle'});
            await page.waitForTimeout(1200);
            const state=await page.evaluate(()=>({title:document.title,buttons:[...document.querySelectorAll('button')].map(b=>({id:b.id,text:(b.innerText||'').trim().slice(0,80),disabled:b.disabled,displayed:!!(b.offsetWidth||b.offsetHeight||b.getClientRects().length)}))}));
            console.log('BUTTONS '+JSON.stringify(state.buttons));
            console.log('PAGE '+JSON.stringify(state));
            console.log('ERROR_COUNT '+errors.length);
            for(const e of errors) console.log(e);
            if(errors.length) process.exit(1);
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/smoke.cjs
